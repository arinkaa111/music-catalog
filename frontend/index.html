<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Music Catalog</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 900px; margin: 40px auto; padding: 0 20px;
            background: #0f1115; color: #e6e6e6;
        }
        h1 { color: #4ade80; }
        h2 { margin-top: 40px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        form { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        input, button {
            padding: 10px 14px; border-radius: 6px; border: 1px solid #333;
            background: #1a1d24; color: #e6e6e6; font-size: 14px;
        }
        input { flex: 1; min-width: 180px; }
        button {
            background: #4ade80; color: #0f1115; font-weight: 600;
            cursor: pointer; border: none;
        }
        button:hover { background: #22c55e; }
        ul { list-style: none; padding: 0; }
        li {
            padding: 12px 16px; margin: 8px 0; background: #1a1d24;
            border-radius: 6px; display: flex; justify-content: space-between;
            align-items: center; gap: 10px;
        }
        .empty { color: #777; font-style: italic; }
        .error { color: #f87171; }
        .artist-info { color: #9ca3af; font-size: 13px; }
        .delete-btn {
            background: #ef4444; color: white; padding: 6px 12px;
            font-size: 12px; border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🎵 Music Catalog</h1>
    <p>Веб-каталог музыки — FastAPI + PostgreSQL + HTML/JS</p>

    <h2>Артисты</h2>
    <form id="artistForm">
        <input name="name" placeholder="Имя артиста" required>
        <input name="country" placeholder="Страна (необязательно)">
        <button type="submit">Добавить артиста</button>
    </form>
    <ul id="artistsList"></ul>

    <h2>Треки</h2>
    <form id="trackForm">
        <input name="title" placeholder="Название трека" required>
        <input name="genre" placeholder="Жанр (необязательно)">
        <input name="album_id" type="number" placeholder="ID альбома" required>
        <button type="submit">Добавить трек</button>
    </form>
    <ul id="tracksList"></ul>

    <script>
        const API = "http://127.0.0.1:8000/api";

        async function loadArtists() {
            const res = await fetch(`${API}/artists/`);
            const artists = await res.json();
            const list = document.getElementById("artistsList");
            if (artists.length === 0) {
                list.innerHTML = '<li class="empty">Пока нет артистов</li>';
                return;
            }
            list.innerHTML = artists.map(a =>
                `<li>
                    <div>
                        <strong>${a.name}</strong>
                        ${a.country ? `<span class="artist-info"> — ${a.country}</span>` : ""}
                    </div>
                    <span class="artist-info">id: ${a.id}</span>
                </li>`
            ).join("");
        }

        async function loadTracks() {
            const res = await fetch(`${API}/tracks/`);
            const tracks = await res.json();
            const list = document.getElementById("tracksList");
            if (tracks.length === 0) {
                list.innerHTML = '<li class="empty">Пока нет треков</li>';
                return;
            }
            list.innerHTML = tracks.map(t =>
                `<li>
                    <div>
                        <strong>${t.title}</strong>
                        ${t.genre ? `<span class="artist-info"> — ${t.genre}</span>` : ""}
                    </div>
                    <button class="delete-btn" onclick="deleteTrack(${t.id})">Удалить</button>
                </li>`
            ).join("");
        }

        document.getElementById("artistForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
                name: form.name.value,
                country: form.country.value || null,
                description: null,
            };
            const res = await fetch(`${API}/artists/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
            if (res.ok) {
                form.reset();
                loadArtists();
            } else {
                alert("Ошибка при добавлении артиста");
            }
        });

        document.getElementById("trackForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
                title: form.title.value,
                genre: form.genre.value || null,
                duration: null,
                album_id: parseInt(form.album_id.value),
            };
            const res = await fetch(`${API}/tracks/`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });
            if (res.ok) {
                form.reset();
                loadTracks();
            } else {
                alert("Ошибка: альбом с таким ID не найден");
            }
        });

        async function deleteTrack(id) {
            if (!confirm("Удалить трек?")) return;
            const res = await fetch(`${API}/tracks/${id}`, { method: "DELETE" });
            if (res.ok || res.status === 204) loadTracks();
        }

        loadArtists();
        loadTracks();
    </script>
</body>
</html>
